services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m
    pids_limit: 100
    networks: [backend]

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=100"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conecta_waba}
      POSTGRES_USER: ${POSTGRES_USER:-conecta_waba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env.vps}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-conecta_waba} -d ${POSTGRES_DB:-conecta_waba}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    pids_limit: 200
    networks: [backend]

  app:
    image: conecta-waba:${IMAGE_TAG:-local}
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-conecta_waba}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-conecta_waba}
      DATABASE_SSL: disable
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_OPTIONS: --max-old-space-size=512
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Define DATA_ENCRYPTION_KEY en .env.vps}
      APP_URL: https://${DOMAIN}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
      META_APP_ID: ${META_APP_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      META_CONFIGURATION_ID: ${META_CONFIGURATION_ID}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v25.0}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      META_WEBHOOK_SIGNATURE_REQUIRED: ${META_WEBHOOK_SIGNATURE_REQUIRED:-true}
      WEBHOOK_MAX_BODY_BYTES: ${WEBHOOK_MAX_BODY_BYTES:-1048576}
      N8N_TIMEOUT_MS: ${N8N_TIMEOUT_MS:-10000}
      CHATWOOT_TIMEOUT_MS: ${CHATWOOT_TIMEOUT_MS:-10000}
      META_TIMEOUT_MS: ${META_TIMEOUT_MS:-15000}
      QUEUE_MAX_ATTEMPTS: ${QUEUE_MAX_ATTEMPTS:-8}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 768m
    pids_limit: 200
    networks: [backend]

  worker:
    image: conecta-waba:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-conecta_waba}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-conecta_waba}
      DATABASE_SSL: disable
      DATABASE_POOL_SIZE: ${WORKER_DATABASE_POOL_SIZE:-10}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Define DATA_ENCRYPTION_KEY en .env.vps}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_OPTIONS: --max-old-space-size=512
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      N8N_TIMEOUT_MS: ${N8N_TIMEOUT_MS:-10000}
      CHATWOOT_TIMEOUT_MS: ${CHATWOOT_TIMEOUT_MS:-10000}
      QUEUE_MAX_ATTEMPTS: ${QUEUE_MAX_ATTEMPTS:-8}
      QUEUE_RETENTION_DAYS: ${QUEUE_RETENTION_DAYS:-30}
      FAILED_JOB_RETENTION_DAYS: ${FAILED_JOB_RETENTION_DAYS:-180}
    command: ["npm", "run", "worker"]
    healthcheck:
      test: ["CMD", "node", "scripts/worker-health.mjs"]
      interval: 15s
      timeout: 5s
      retries: 8
    mem_limit: 768m
    pids_limit: 200
    networks: [backend]

  mock-integrations:
    image: node:22-alpine
    profiles: [test]
    working_dir: /app
    volumes:
      - ./scripts/mock-integrations.mjs:/app/mock-integrations.mjs:ro
    command: ["node", "/app/mock-integrations.mjs"]
    networks: [backend]

  admin:
    image: conecta-waba:${IMAGE_TAG:-local}
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-conecta_waba}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-conecta_waba}
      DATABASE_SSL: disable
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Define DATA_ENCRYPTION_KEY en .env.vps}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Define ADMIN_EMAIL en .env.vps}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en .env.vps}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
    command: ["npm", "run", "admin:create"]
    networks: [backend]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend]
    mem_limit: 128m
    pids_limit: 100

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  redis_data:
